version: '3.8'

services:
  mongodb:
    container_name: mongodb
    image: "mongo:4.2.16-bionic"
    environment:
      - MONGO_INITDB_DATABASE=curd
      - MONGO_INITDB_ROOT_USERNAME=tharun
      - MONGO_INITDB_ROOT_PASSWORD=abcd
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - mongodb_network

networks:
  mongodb_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
